<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="studio:contract" content="v0">
  <meta name="studio:format" content="1080x1350">
  <link rel="stylesheet" href="/brand/brand.css">
  <style>
    [data-artboard] { position: relative; background: var(--color-paper); }
    [data-artboard] > [data-layer] { position: absolute; }
    [data-type="text"] { hyphens: none; }

    /* label band with raised centre tab (pack quote) */
    .band { background: var(--color-green); }
    .band-tab { background: var(--color-green); border-radius: 16px 16px 0 0; }

    /* intro stack: eyebrow + rule, display headline, subhead */
    .intro { display: flex; flex-direction: column; gap: var(--space-24); }
    .eyebrow-stack { display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-16); }
    .eyebrow { color: var(--color-green-deep); white-space: nowrap; }
    .rule { margin: 0; width: 56px; height: 6px; background: var(--color-green); }
    .headline {
      font-family: var(--font-display);
      font-size: 88px;
      font-weight: 900;
      font-stretch: 125%;
      font-style: italic;
      text-transform: uppercase;
      letter-spacing: -0.01em;
      line-height: 1;
      color: var(--color-ink);
      text-wrap: balance;
    }
    .subhead { font-weight: 500; color: var(--color-graphite); }

    /* hexagon element badges: shape + letter stacked in one grid cell */
    .badge { display: grid; place-items: center; }
    .badge > * { grid-area: 1 / 1; }
    .hex { width: 120px; height: 104px; clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); }
    .hex-b { background: var(--color-amber); }
    .hex-zn { background: var(--color-green); }
    .badge-letter {
      font-family: var(--font-text);
      font-size: 44px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0;
      color: var(--color-ink);
    }

    /* sign-off */
    .sign-off { display: flex; align-items: center; justify-content: space-between; }
    .sign-off-logo { width: 248px; height: 40px; }
    .web {
      font-family: var(--font-text);
      font-size: 28px;
      font-weight: 500;
      line-height: 1.3;
      letter-spacing: 0.02em;
      color: var(--color-graphite);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <main data-artboard style="width:1080px;height:1350px">

    <img data-layer="product-photo" data-type="image"
         src="/brand/assets/product-venta-borinc.png" alt="Venta Borinc ambalajı"
         style="left:108px; top:200px; width:1160px; height:1160px">

    <div data-layer="label-band" data-type="shape" data-role="decoration" class="band"
         style="left:0; top:1326px; width:1080px; height:24px"></div>
    <div data-layer="label-band-tab" data-type="shape" data-role="decoration" class="band-tab"
         style="left:444px; top:1302px; width:192px; height:32px"></div>

    <div data-layer="intro" data-type="group" class="intro"
         style="left:72px; top:72px; width:936px">
      <div data-layer="eyebrow-stack" data-type="group" class="eyebrow-stack">
        <p data-layer="eyebrow" data-type="text" data-role="eyebrow" class="ts-eyebrow eyebrow">VENTA BORINC</p>
        <div data-layer="eyebrow-rule" data-type="shape" data-role="decoration" class="brand-rule rule"></div>
      </div>
      <h1 data-layer="headline" data-type="text" data-role="headline" class="ts-display-m headline">Bor ve çinko<br>bir arada</h1>
      <p data-layer="subhead" data-type="text" data-role="subhead" class="ts-body subhead">Mikro bitki besin maddeleri karışımı.</p>
    </div>

    <div data-layer="badge-b" data-type="group" class="badge"
         style="left:72px; top:720px; width:120px; height:104px">
      <div data-layer="badge-b-hex" data-type="shape" data-role="badge" class="hex hex-b"></div>
      <p data-layer="badge-b-letter" data-type="text" data-role="badge" class="badge-letter">B</p>
    </div>

    <div data-layer="badge-zn" data-type="group" class="badge"
         style="left:168px; top:776px; width:120px; height:104px">
      <div data-layer="badge-zn-hex" data-type="shape" data-role="badge" class="hex hex-zn"></div>
      <p data-layer="badge-zn-letter" data-type="text" data-role="badge" class="badge-letter">Zn</p>
    </div>

    <div data-layer="sign-off" data-type="group" class="sign-off"
         style="left:72px; top:1232px; width:936px; height:48px">
      <img data-layer="logo-venta" data-type="logo" class="sign-off-logo"
           src="/brand/logos/venta-wordmark-black.standin.png" alt="VENTA">
      <p data-layer="web" data-type="text" data-role="cta" class="ts-caption web">www.mtmagro.com</p>
    </div>

  </main>
</body>
</html>
