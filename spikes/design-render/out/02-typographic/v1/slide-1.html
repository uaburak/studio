<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="studio:contract" content="v0">
  <meta name="studio:format" content="1080x1350">
  <link rel="stylesheet" href="/brand/brand.css">
  <style>
    [data-artboard] {
      position: relative;
      background: var(--color-paper);
    }

    /* Upper field: the bag surface (mist), carries the one loud statement */
    .bag-field {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 924px;
      background: var(--color-mist);
    }

    /* Display caps: wide black italic, three words stacked so PRAK / PRAK align */
    .headline {
      position: absolute;
      left: 72px;
      top: 80px;
      width: 936px;
      font-family: var(--font-display);
      font-size: 152px;
      font-weight: 900;
      font-style: italic;
      font-stretch: 125%;
      line-height: 0.98;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      text-wrap: balance;
      hyphens: manual;
      color: var(--color-ink);
    }
    .headline .slash {
      color: var(--color-green-deep);
    }

    /* Label band with the raised centre tab, quoted from the pack's label edge */
    .label-band {
      position: absolute;
      left: 0;
      top: 892px;
      width: 1080px;
      height: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .label-band-tab {
      flex: none;
      width: 216px;
      height: 24px;
      background: var(--color-green);
      border-radius: var(--radius-md) var(--radius-md) 0 0;
    }
    .label-band-bar {
      flex: none;
      width: 1080px;
      height: 16px;
      background: var(--color-green);
    }

    /* Lower field: the label, set in label typography */
    .label-text {
      position: absolute;
      left: 72px;
      top: 996px;
      width: 776px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: var(--space-16);
    }
    .eyebrow {
      font-family: var(--font-text);
      font-size: 26px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--color-green-deep);
    }
    .eyebrow-rule {
      flex: none;
      width: var(--rule-width);
      height: var(--rule-thickness);
      background: var(--color-green);
    }
    .body {
      width: 100%;
      margin-top: 8px;
      font-family: var(--font-text);
      font-size: 36px;
      font-weight: 500;
      line-height: 1.34;
      text-wrap: balance;
      hyphens: manual;
      color: var(--color-graphite);
    }
    .body b {
      font-weight: 700;
      color: var(--color-ink);
    }

    /* Sign-off: logo left, web address right, same position on every post */
    .sign-off {
      position: absolute;
      left: 72px;
      top: 1234px;
      width: 936px;
      height: 44px;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      flex: none;
      height: 44px;
      width: auto;
    }
    .web {
      font-family: var(--font-text);
      font-size: 28px;
      font-weight: 500;
      line-height: 1.2;
      color: var(--color-graphite);
    }
  </style>
</head>
<body>
  <main data-artboard style="width:1080px;height:1350px">

    <div data-layer="bag-field" data-type="shape" data-role="decoration" class="bag-field"></div>

    <h1 data-layer="headline" data-type="text" data-role="headline" class="headline">Toprak<span class="slash">/</span><br>yaprak<br>analizi</h1>

    <div data-layer="label-band" data-type="group" data-role="decoration" class="label-band">
      <div data-layer="label-band-tab" data-type="shape" data-role="decoration" class="label-band-tab"></div>
      <div data-layer="label-band-bar" data-type="shape" data-role="decoration" class="label-band-bar"></div>
    </div>

    <div data-layer="label-text" data-type="group" class="label-text">
      <p data-layer="eyebrow" data-type="text" data-role="eyebrow" class="eyebrow">Etiketteki öneri</p>
      <div data-layer="eyebrow-rule" data-type="shape" data-role="decoration" class="eyebrow-rule"></div>
      <p data-layer="body" data-type="text" data-role="body" class="body"><b>Venta Borinc</b>’i analiz yaptırarak kullanmanız tavsiye edilir.</p>
    </div>

    <div data-layer="sign-off" data-type="group" class="sign-off">
      <img data-layer="logo-venta" data-type="logo" class="logo" src="/brand/logos/venta-wordmark-black.standin.png" alt="Venta">
      <p data-layer="web" data-type="text" data-role="caption" class="web">www.mtmagro.com</p>
    </div>

  </main>
</body>
</html>
