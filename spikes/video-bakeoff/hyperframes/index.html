<!doctype html>
<!--
  Venta Borinc — 8 s Reel (1080x1920, 30 fps). Bake-off composition, HyperFrames variant.
  Brand tokens and copy are declared ONCE as composition variables (as a brand profile would supply them).
  Scalar variables are exposed to CSS as var(--<id>); text/image use data-var-* bindings.
-->
<html
  lang="tr"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"colorPrimary","type":"color","label":"Brand green","role":"style","default":"#3E9B3A"},
    {"id":"colorDeep","type":"color","label":"Brand deep green","role":"style","default":"#0E3B1F"},
    {"id":"colorSurface","type":"color","label":"Light surface","role":"style","default":"#F3F7F0"},
    {"id":"colorOnDark","type":"color","label":"Text on dark","role":"style","default":"#FFFFFF"},
    {"id":"colorAccent","type":"color","label":"Accent on dark","role":"style","default":"#A6E38F"},
    {"id":"fontDisplay","type":"font","label":"Display font","role":"style","default":"Montserrat"},
    {"id":"headline","type":"string","label":"Hook headline","role":"content","default":"Toprağın ihtiyacı, doğru dozda."},
    {"id":"productName","type":"string","label":"Product name","role":"content","portrays":["subject_name"],"default":"VENTA BORINC"},
    {"id":"productLine","type":"string","label":"Product line","role":"content","default":"Bor (B) ve Çinko (Zn)"},
    {"id":"productImage","type":"image","label":"Product photo","role":"content","default":"assets/venta-borinc.png"},
    {"id":"companyName","type":"string","label":"Company","role":"content","portrays":["subject_name"],"default":"MTM AGRO"},
    {"id":"website","type":"string","label":"Website","role":"content","portrays":["subject_domain"],"default":"mtmagro.com"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- Local copy of GSAP: no network fetch at render time. -->
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/Montserrat_800ExtraBold.ttf") format("truetype");
        font-weight: 800;
        font-display: block;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/Montserrat_600SemiBold.ttf") format("truetype");
        font-weight: 600;
        font-display: block;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--colorDeep); }
      #root {
        position: relative; width: 1080px; height: 1920px; overflow: hidden;
        font-family: var(--fontDisplay), sans-serif;
      }
      .clip { position: absolute; inset: 0; }

      /* Scene 1 — hook */
      #s1 { background: var(--colorDeep); z-index: 1; display: flex; align-items: center; padding: 0 96px; }
      #headline { color: var(--colorOnDark); font-weight: 800; font-size: 132px; line-height: 1.08; letter-spacing: -0.02em; }
      #headline .w { display: inline-block; margin-right: 0.24em; }
      #headline .w.accent { color: var(--colorAccent); }

      /* Scene 2 — product reveal */
      #s2 { background: var(--colorSurface); z-index: 2; }
      #card {
        position: absolute; left: 210px; top: 290px; width: 660px; height: 660px;
        background: #fff; border-radius: 48px; overflow: hidden;
        box-shadow: 0 48px 96px rgba(14, 59, 31, 0.18), 0 8px 24px rgba(14, 59, 31, 0.08);
      }
      #product { width: 100%; height: 100%; object-fit: cover; display: block; transform: scale(1.4); /* crop the white margin of the source photo */ }
      #productName {
        position: absolute; left: 90px; right: 90px; top: 1000px; text-align: center;
        color: var(--colorDeep); font-weight: 800; font-size: 104px; letter-spacing: 0.02em;
      }
      #productLine {
        position: absolute; left: 90px; right: 90px; top: 1140px; text-align: center;
        color: var(--colorPrimary); font-weight: 600; font-size: 58px;
      }

      /* Scene 3 — closing */
      #s3 {
        background: var(--colorPrimary); z-index: 3;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px;
      }
      #companyName { color: var(--colorOnDark); font-weight: 800; font-size: 128px; letter-spacing: 0.04em; }
      #website { color: var(--colorOnDark); font-weight: 600; font-size: 64px; opacity: 0.92; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-fps="30" data-width="1080" data-height="1920">
      <section id="s1" class="clip" data-start="0" data-duration="3.1" data-track-index="0">
        <h1 id="headline" data-var-text="headline">Toprağın ihtiyacı, doğru dozda.</h1>
      </section>

      <section id="s2" class="clip" data-start="2.6" data-duration="3.1" data-track-index="1">
        <div id="card"><img id="product" data-var-src="productImage" src="assets/venta-borinc.png" alt="" /></div>
        <h2 id="productName" data-var-text="productName">VENTA BORINC</h2>
        <p id="productLine" data-var-text="productLine">Bor (B) ve Çinko (Zn)</p>
      </section>

      <section id="s3" class="clip" data-start="5.2" data-duration="2.8" data-track-index="2">
        <h2 id="companyName" data-var-text="companyName">MTM AGRO</h2>
        <p id="website" data-var-text="website">mtmagro.com</p>
      </section>
    </div>

    <script>
      // Timing tokens (seconds). Edit here to retime the film.
      const T = { wordStart: 0.3, wordStagger: 0.2, wordDur: 0.6, t1: 2.6, t2: 5.2, transition: 0.5, reveal: 0.8, text: 0.6 };

      // Split the headline into word spans (the last two words get the accent colour).
      const vars = (window.__hyperframes && window.__hyperframes.getVariables()) || {};
      const headline = document.getElementById("headline");
      const words = (vars.headline || headline.textContent).trim().split(/\s+/);
      headline.innerHTML = words
        .map((w, i) => `<span class="w${i >= words.length - 2 ? " accent" : ""}">${w}</span>`)
        .join("");

      const tl = gsap.timeline({ paused: true });

      // Scene 1: words in, one by one.
      tl.fromTo("#headline .w", { y: 90, opacity: 0 },
        { y: 0, opacity: 1, duration: T.wordDur, ease: "power3.out", stagger: T.wordStagger }, T.wordStart);

      // Transition 1: scene 2 slides up over scene 1 (with slight parallax on scene 1).
      tl.fromTo("#s2", { yPercent: 100 }, { yPercent: 0, duration: T.transition, ease: "power3.inOut" }, T.t1);
      tl.fromTo("#s1", { yPercent: 0 }, { yPercent: -20, duration: T.transition, ease: "power3.inOut" }, T.t1);

      // Scene 2: product card scales/slides in, then name and line.
      const s2 = T.t1 + T.transition - 0.1;
      tl.fromTo("#card", { y: 160, scale: 0.86, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: T.reveal, ease: "power3.out" }, s2);
      tl.fromTo("#productName", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: T.text, ease: "power3.out" }, s2 + 0.5);
      tl.fromTo("#productLine", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: T.text, ease: "power3.out" }, s2 + 0.75);

      // Transition 2: brand-green wipe from the bottom.
      tl.fromTo("#s3", { clipPath: "inset(100% 0% 0% 0%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: T.transition, ease: "power3.inOut" }, T.t2);

      // Scene 3: closing text.
      const s3 = T.t2 + T.transition - 0.1;
      tl.fromTo("#companyName", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: T.text, ease: "power3.out" }, s3);
      tl.fromTo("#website", { y: 40, opacity: 0 }, { y: 0, opacity: 0.92, duration: T.text, ease: "power3.out" }, s3 + 0.25);

      // Pad the timeline to the full 8 s.
      tl.set({}, {}, 8);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
