<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <!-- Import fidelity (E11) with pictures and text: checked on the document (pictures' crop
       windows against Chromium's own pixels, texts' shadows and lines, the report). -->
  <link rel="stylesheet" href="/brand/brand.css">
  <style>
    main[data-artboard] { position: relative; background: var(--color-paper); }
    .a { position: absolute; }
    .shout {
      font-family: var(--font-display); font-size: 88px; font-weight: 900; line-height: 1.04;
      color: var(--color-ink); text-wrap: balance; text-transform: uppercase; margin: 0;
    }
    .glow { font-family: var(--font-text); font-size: 40px; font-weight: 700; line-height: 1.2;
      color: #ffffff; text-shadow: 0 2px 12px rgba(0, 0, 0, 0.45); margin: 0; }
  </style>
</head>
<body>
  <main data-artboard style="width:1080px;height:1350px">
    <img data-layer="photo" data-type="image" class="a" src="/brand/assets/product-venta-borinc.png" alt=""
         style="left:60px;top:60px;width:600px;height:400px;object-fit:cover;object-position:20% 80%">
    <img data-layer="photo-none" data-type="image" class="a" src="/brand/assets/product-venta-borinc.png" alt=""
         style="left:700px;top:60px;width:320px;height:240px;object-fit:none;object-position:30% 40%">
    <div data-layer="hero" data-type="shape" class="a"
         style="left:60px;top:500px;width:960px;height:360px;background:linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.6)), url(/brand/assets/product-venta-borinc.png) 50% 30% / cover no-repeat"></div>
    <img data-layer="grey" data-type="image" class="a" src="/brand/assets/product-venta-borinc.png" alt=""
         style="left:700px;top:320px;width:160px;height:160px;object-fit:cover;filter:grayscale(1)">
    <h1 data-layer="headline" data-type="text" data-role="headline" class="a shout"
        style="left:72px;top:900px;width:620px">Bir istif bitti, yenisi geliyor</h1>
    <p data-layer="glow" data-type="text" data-role="body" class="a glow"
       style="left:72px;top:560px;width:600px">Toprağınız için bor</p>
    <img data-layer="logo" data-type="logo" class="a" src="/brand/logos/studio-logo.svg" alt=""
         style="left:72px;top:1230px;width:240px;height:60px">
    <div data-layer="masked" data-type="shape" class="a"
         style="left:760px;top:900px;width:200px;height:200px;background:#2f5d50;-webkit-mask-image:linear-gradient(#000, transparent);mask-image:linear-gradient(#000, transparent)"></div>
  </main>
</body>
</html>
