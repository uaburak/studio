<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <!-- Import fidelity (E11), no text and no pictures: compared pixel for pixel with the canvas
       document Wecra's engine exports as SVG. Every case is something Wecra's converter alone
       drops or moves. -->
  <style>
    body { margin: 0; }
    main[data-artboard] {
      position: relative; overflow: hidden;
      background: linear-gradient(135deg, #1d3557 0%, #457b9d 55%, #e63946 100%);
    }
    .a { position: absolute; }
  </style>
</head>
<body>
  <main data-artboard style="width:1080px;height:1350px">
    <div data-layer="radial" data-type="shape" class="a"
         style="left:60px;top:60px;width:420px;height:300px;background:radial-gradient(circle at 30% 40%, #ffd166 0%, #ef476f 60%, #073b4c 100%)"></div>
    <div data-layer="corner" data-type="shape" class="a"
         style="left:560px;top:60px;width:460px;height:300px;background:linear-gradient(to bottom right, #06d6a0, #118ab2 70%, #073b4c)"></div>
    <div data-layer="ellipse" data-type="shape" class="a"
         style="left:60px;top:420px;width:460px;height:260px;background:radial-gradient(ellipse farthest-side at 70% 30%, #ffffff 0%, rgba(255,255,255,0) 100%), #264653"></div>
    <div data-layer="conic" data-type="shape" class="a"
         style="left:600px;top:420px;width:300px;height:300px;background:conic-gradient(from 45deg at 50% 50%, #e76f51, #f4a261, #e9c46a, #2a9d8f, #e76f51)"></div>
    <div data-layer="rotated" data-type="shape" class="a"
         style="left:120px;top:760px;width:300px;height:160px;background:#f1faee;transform:translate(20px, 10px) rotate(18deg);border-radius:24px"></div>
    <div data-layer="scaled" data-type="shape" class="a"
         style="left:600px;top:780px;width:200px;height:120px;background:#a8dadc;transform:scale(1.4);transform-origin:0 0;border-radius:16px"></div>
    <div data-layer="under" data-type="shape" class="a"
         style="left:80px;top:1000px;width:400px;height:240px;background:#e63946;z-index:3"></div>
    <div data-layer="over" data-type="shape" class="a"
         style="left:260px;top:1080px;width:400px;height:200px;background:#2a9d8f;z-index:1"></div>
    <div data-layer="hex" data-type="shape" class="a"
         style="left:760px;top:1000px;width:220px;height:190px;background:#ffb703;clip-path:polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%)"></div>
    <div data-layer="scrim" data-type="shape" class="a"
         style="left:0;top:1200px;width:1080px;height:150px;background:linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.6) 100%)"></div>
    <div data-layer="multiply" data-type="shape" class="a"
         style="left:700px;top:1150px;width:200px;height:120px;background:#ff006e;mix-blend-mode:multiply"></div>
  </main>
</body>
</html>
